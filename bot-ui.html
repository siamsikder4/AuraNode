<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AuraNode - Live Bot UI & Button Customizer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- ড্র্যাগ অ্যান্ড ড্রপের জন্য SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 6px 20px -2px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 24px 16px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 18px; }

    /* Top Navigation */
    .nav { display: flex; background: var(--card-bg); padding: 6px; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); gap: 6px; }
    .nav a { flex: 1; text-align: center; text-decoration: none; padding: 10px 12px; font-size: 13px; font-weight: 700; border-radius: 10px; color: var(--text-muted); transition: 0.2s; }
    .nav a.active { background: var(--primary); color: #fff; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 20px; box-shadow: var(--shadow-md); }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    /* টেলিগ্রাম মোবাইল লাইভ মকআপ */
    .tg-mockup { background: #17212b; border-radius: 18px; padding: 16px; border: 1px solid #242f3d; color: #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .tg-msg { background: #182533; border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.5; border-left: 3px solid #5288c1; margin-bottom: 16px; }
    
    /* প্রিভিউ বাটন কনটেইনার */
    .tg-keyboard-preview { display: flex; flex-wrap: wrap; gap: 8px; }
    .preview-btn {
      padding: 12px 10px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: 700;
      color: #fff; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .preview-btn.full { width: 100%; }
    .preview-btn.half { width: calc(50% - 4px); }

    /* বাটন এডিটর লিস্ট (ড্র্যাগ-অ্যান্ড-ড্রপ) */
    .btn-edit-list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .btn-edit-card {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 14px;
      cursor: grab; display: flex; flex-direction: column; gap: 10px; position: relative;
    }
    .btn-edit-card:active { cursor: grabbing; border-color: var(--primary); }
    
    .drag-handle { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .drag-handle i { font-size: 14px; }

    .input-row { display: flex; gap: 8px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; background: #fff; border: 1px solid var(--border);
      border-radius: 8px; font-size: 13px; font-weight: 600; outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .btn-controls { display: flex; align-items: center; gap: 8px; }
    .color-picker { width: 40px; height: 38px; padding: 2px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); }
    
    .btn-width-toggle {
      flex: 1; padding: 8px; border: 1px solid var(--border); background: #fff; border-radius: 8px;
      font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; color: var(--text-muted);
    }
    .btn-width-toggle.active { background: #e0e7ff; color: var(--primary); border-color: var(--primary); }

    .btn-save-all {
      width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none;
      border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 16px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.3); transition: 0.2s;
    }
    .btn-save-all:active { transform: scale(0.98); }
    .status-text { font-size: 13px; text-align: center; margin-top: 10px; font-weight: 700; min-height: 18px; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNhEQkvKdqk3SK-Ot7boIbJl-44b9QJyc",
      authDomain: "auranode-58027.firebaseapp.com",
      projectId: "auranode-58027",
      storageBucket: "auranode-58027.firebasestorage.app",
      messagingSenderId: "846497828511",
      appId: "1:846497828511:web:da471062e730cde107dcaa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ডিফল্ট বাটন কনফিগারেশন
    let buttonsData = [
      { id: "buy", label: "🎉 Buy Product", width: "full", color: "#16a34a", emoji_id: "" },
      { id: "profile", label: "👤 My Profile", width: "half", color: "#2563eb", emoji_id: "" },
      { id: "deposit", label: "💳 Deposit", width: "half", color: "#2563eb", emoji_id: "" },
      { id: "code", label: "🛡️ Get Code", width: "half", color: "#16a34a", emoji_id: "" },
      { id: "support", label: "🎧 Support", width: "half", color: "#2563eb", emoji_id: "" }
    ];

    // রিয়েলটাইম ডাটাবেস থেকে লোড
    onSnapshot(doc(db, "bot_ui", "settings"), (docSnap) => {
      if (docSnap.exists()) {
        const d = docSnap.data();
        if (d.shop_name) document.getElementById("shopName").value = d.shop_name;
        if (d.welcome_text) document.getElementById("welcomeText").value = d.welcome_text;
        if (d.buttons && Array.isArray(d.buttons)) {
          buttonsData = d.buttons;
        }
      }
      renderEditor();
      renderLivePreview();
    });

    // বাটন এডিটর ড্র্যাগ-অ্যান্ড-ড্রপ রেন্ডার
    function renderEditor() {
      const container = document.getElementById("btnList");
      container.innerHTML = "";

      buttonsData.forEach((btn, index) => {
        const card = document.createElement("div");
        card.className = "btn-edit-card";
        card.dataset.index = index;

        card.innerHTML = `
          <div class="drag-handle">
            <span><i class="fa-solid fa-grip-vertical"></i> বাটন #${index + 1} (চাপ দিয়ে ধরে পজিশন বদলান)</span>
          </div>
          <div class="input-row">
            <input type="text" value="${btn.label}" placeholder="বাটন নাম" oninput="updateLabel(${index}, this.value)">
            <input type="text" value="${btn.emoji_id || ''}" placeholder="Emoji ID" style="max-width: 120px;" oninput="updateEmoji(${index}, this.value)">
          </div>
          <div class="btn-controls">
            <input type="color" class="color-picker" value="${btn.color || '#2563eb'}" onchange="updateColor(${index}, this.value)">
            <button class="btn-width-toggle ${btn.width === 'full' ? 'active' : ''}" onclick="toggleWidth(${index}, 'full')">ফুল স্ক্রিন (১০০%)</button>
            <button class="btn-width-toggle ${btn.width === 'half' ? 'active' : ''}" onclick="toggleWidth(${index}, 'half')">অর্ধেক (৫০%)</button>
          </div>
        `;
        container.appendChild(card);
      });

      // Sortable ইনিশিয়ালাইজেশন
      new Sortable(container, {
        animation: 150,
        handle: '.btn-edit-card',
        onEnd: function (evt) {
          const item = buttonsData.splice(evt.oldIndex, 1)[0];
          buttonsData.splice(evt.newIndex, 0, item);
          renderEditor();
          renderLivePreview();
        }
      });
    }

    // লাইভ প্রিভিউ রেন্ডার
    function renderLivePreview() {
      const pTitle = document.getElementById("shopName").value || "AuraNode Store";
      document.getElementById("prevShopName").innerText = pTitle;

      const pContainer = document.getElementById("previewKeyboard");
      pContainer.innerHTML = "";

      buttonsData.forEach(btn => {
        const b = document.createElement("div");
        b.className = `preview-btn ${btn.width}`;
        b.style.backgroundColor = btn.color || "#2563eb";
        b.innerHTML = `${btn.label}`;
        pContainer.appendChild(b);
      });
    }

    // এডিট ইভেন্ট হ্যান্ডলার
    window.updateLabel = (i, val) => { buttonsData[i].label = val; renderLivePreview(); };
    window.updateEmoji = (i, val) => { buttonsData[i].emoji_id = val; renderLivePreview(); };
    window.updateColor = (i, val) => { buttonsData[i].color = val; renderLivePreview(); };
    window.toggleWidth = (i, w) => { buttonsData[i].width = w; renderEditor(); renderLivePreview(); };
    window.onTextChange = () => renderLivePreview();

    // Firebase-এ সেভ করা
    window.saveAllToFirebase = async function() {
      const status = document.getElementById("statusMsg");
      status.style.color = "var(--text-muted)";
      status.innerText = "সংরক্ষণ করা হচ্ছে...";

      const payload = {
        shop_name: document.getElementById("shopName").value.trim(),
        welcome_text: document.getElementById("welcomeText").value.trim(),
        buttons: buttonsData,
        updatedAt: new Date()
      };

      try {
        await setDoc(doc(db, "bot_ui", "settings"), payload, { merge: true });
        status.style.color = "var(--success)";
        status.innerText = "সফলভাবে সেভ হয়েছে! বটে বাটন পজিশন ও কালার লাইভ হয়ে গেছে।";
      } catch (e) {
        status.style.color = "var(--danger)";
        status.innerText = "ত্রুটি: " + e.message;
      }
    };
  </script>
</head>
<body>

<div class="container">
  <!-- Navbar -->
  <nav class="nav">
    <a href="index.html">📦 ইনভেন্টরি</a>
    <a href="bot-ui.html" class="active">🎨 বটের UI ও বাটন</a>
    <a href="customers.html">👥 কাস্টমার</a>
  </nav>

  <!-- লাইভ মকআপ -->
  <div class="card">
    <div class="card-title">📱 লাইভ প্রিভিউ (উপরে দেখুন)</div>
    <div class="tg-mockup">
      <div class="tg-msg">
        👋 <b>Welcome!</b><br>
        ⚡ <span id="prevShopName" style="color:#38bdf8;">AuraNode Store</span><br>
        <span id="prevWelcome">স্বাগতম আমাদের স্টোরে! নিচে ক্লিক করুন:</span>
      </div>
      <!-- লাইভ বাটনসমূহ -->
      <div class="tg-keyboard-preview" id="previewKeyboard"></div>
    </div>
  </div>

  <!-- সেটিংস ও বাটন ড্র্যাগ-অ্যান্ড-ড্রপ -->
  <div class="card">
    <div class="card-title">⚙️ বাটন সাজান ও কালার দিন</div>

    <label style="font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:4px; display:block;">শপের নাম</label>
    <input type="text" id="shopName" value="Your Proxy & VPN" oninput="onTextChange()" style="margin-bottom:12px;">

    <label style="font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:4px; display:block;">ওয়েলকাম মেসেজ</label>
    <textarea id="welcomeText" rows="2" oninput="onTextChange()" style="margin-bottom:14px;">স্বাগতম আমাদের স্টোরে! নিচে ক্লিক করুন:</textarea>

    <label style="font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:4px; display:block;">বাটন লিস্ট (ড্র্যাগ করে ওপরে-নিচে নিন)</label>
    <div class="btn-edit-list" id="btnList"></div>

    <button class="btn-save-all" onclick="saveAllToFirebase()">বটের লাইভ বাটন আপডেট করুন</button>
    <div id="statusMsg" class="status-text"></div>
  </div>
</div>

</body>
</html>
