<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sedap. Mobile Admin</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #00b074;
      --primary-light: #e6f7f1;
      --text-dark: #1e293b;
      --text-muted: #94a3b8;
      --border: #f1f5f9;
      --blue: #0284c7;
      --orange: #f97316;
      --red: #ef4444;
      --radius: 16px;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-dark);
      padding: 16px;
      padding-bottom: 90px; /* Bottom Nav-এর জন্য জায়গা */
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px; /* মোবাইলের উপযুক্ত মাপ */
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* --- ১. মোবাইল হেডার --- */
    .mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    .brand-title h2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-title h2 span {
      color: var(--primary);
    }

    .brand-title p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .header-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-profile img {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid #ffffff;
      box-shadow: var(--shadow);
    }

    /* --- ২. কুইক মেট্রিক গ্রিড --- */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .m-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
    }

    .m-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .ic-green { background: #e6f7f1; color: var(--primary); }
    .ic-blue { background: #e0f2fe; color: var(--blue); }
    .ic-orange { background: #ffedd5; color: var(--orange); }
    .ic-red { background: #fee2e2; color: var(--red); }

    .m-info h3 {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .m-info p {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* --- ৩. মোবাইল কার্ড কনটেইনার --- */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .badge-live {
      background: #e6f7f1;
      color: var(--primary);
    }

    /* ফর্ম ইনপুট */
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      outline: none;
      margin-bottom: 12px;
      color: var(--text-dark);
      transition: all 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 176, 116, 0.2);
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    /* --- ৪. মোবাইল অর্ডার লিস্ট আইটেম --- */
    .order-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .order-left h4 {
      font-size: 13px;
      font-weight: 700;
    }

    .order-left p {
      font-size: 11px;
      color: var(--blue);
      margin-top: 2px;
    }

    .order-right {
      text-align: right;
    }

    .order-product {
      font-size: 11px;
      font-weight: 700;
      background: #ffffff;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: inline-block;
    }

    /* --- ৫. বটম মোবাইল অ্যাপ বার --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .nav-item i {
      font-size: 18px;
    }

    .nav-item.active {
      color: var(--primary);
    }
  </style>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNhEQkvKdqk3SK-Ot7boIbJl-44b9QJyc",
      authDomain: "auranode-58027.firebaseapp.com",
      projectId: "auranode-58027",
      storageBucket: "auranode-58027.firebasestorage.app",
      messagingSenderId: "846497828511",
      appId: "1:846497828511:web:da471062e730cde107dcaa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ১. লাইভ স্টক সংখ্যা ট্র্যাক
    onSnapshot(doc(db, "inventory", "stock"), (docSnap) => {
      const vpn = (docSnap.exists() && docSnap.data().vpn) ? docSnap.data().vpn.length : 0;
      const proxy = (docSnap.exists() && docSnap.data().proxy) ? docSnap.data().proxy.length : 0;
      document.getElementById('statStock').innerText = vpn + proxy;
    });

    // ২. কাস্টমার সংখ্যা ট্র্যাক
    onSnapshot(collection(db, "users"), (snap) => {
      document.getElementById('statUsers').innerText = snap.size;
    });

    // ৩. রিয়েলটাইম অর্ডার ও রেভিনিউ ট্র্যাক
    const qOrders = query(collection(db, "orders"), orderBy("timestamp", "desc"), limit(6));
    onSnapshot(qOrders, (snapshot) => {
      document.getElementById('statOrders').innerText = snapshot.size;
      document.getElementById('statRevenue').innerText = `${snapshot.size * 20} ৳`;

      const list = document.getElementById("orderList");
      list.innerHTML = "";

      if (snapshot.empty) {
        list.innerHTML = `<div style="text-align:center; padding: 15px; color: var(--text-muted); font-size: 12px;">এখনও কোনো অর্ডার আসেনি</div>`;
        return;
      }

      snapshot.forEach(doc => {
        const o = doc.data();
        const div = document.createElement("div");
        div.className = "order-item";
        div.innerHTML = `
          <div class="order-left">
            <h4>${o.first_name || 'Customer'}</h4>
            <p>@${o.username || 'N/A'}</p>
          </div>
          <div class="order-right">
            <span class="order-product">${o.product}</span>
          </div>
        `;
        list.appendChild(div);
      });
    });

    // ৪. বটের টোকেন সেভ
    window.saveBotToken = async function() {
      const token = document.getElementById("botToken").value.trim();
      if (!token) return alert("টোকেন ইনপুট দিন!");
      await setDoc(doc(db, "bot_config", "main"), { token, updatedAt: new Date() }, { merge: true });
      alert("বট টোকেন কানেক্ট হয়েছে!");
      document.getElementById("botToken").value = "";
    };

    // ৫. স্টক যোগ করা
    window.saveStock = async function() {
      const cat = document.getElementById("stockCat").value;
      const raw = document.getElementById("stockData").value.trim();
      if (!raw) return alert("স্টক ডাটা দিন!");
      const items = raw.split("\n").map(i => i.trim()).filter(i => i.length > 0);
      await setDoc(doc(db, "inventory", "stock"), { [cat]: items }, { merge: true });
      alert(`${items.length}টি আইটেম স্টকে যুক্ত হয়েছে!`);
      document.getElementById("stockData").value = "";
    };
  </script>
</head>
<body>

  <div class="app-container">

    <!-- হেডার -->
    <header class="mobile-header">
      <div class="brand-title">
        <h2>Sedap<span>.</span></h2>
        <p>Mobile Store Console</p>
      </div>
      <div class="header-profile">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Admin">
      </div>
    </header>

    <!-- মেট্রিক কার্ডস -->
    <div class="metrics-grid">
      <div class="m-card">
        <div class="m-icon ic-green"><i class="fa-solid fa-cart-shopping"></i></div>
        <div class="m-info">
          <h3 id="statOrders">0</h3>
          <p>Orders</p>
        </div>
      </div>
      <div class="m-card">
        <div class="m-icon ic-blue"><i class="fa-solid fa-cube"></i></div>
        <div class="m-info">
          <h3 id="statStock">0</h3>
          <p>Stock</p>
        </div>
      </div>
      <div class="m-card">
        <div class="m-icon ic-orange"><i class="fa-solid fa-users"></i></div>
        <div class="m-info">
          <h3 id="statUsers">0</h3>
          <p>Users</p>
        </div>
      </div>
      <div class="m-card">
        <div class="m-icon ic-red"><i class="fa-solid fa-wallet"></i></div>
        <div class="m-info">
          <h3 id="statRevenue">0 ৳</h3>
          <p>Revenue</p>
        </div>
      </div>
    </div>

    <!-- স্টক আপডেট কার্ড -->
    <div class="card">
      <div class="card-title">
        <span>স্টক ইনভেন্টরি</span>
        <span class="badge badge-live">Live</span>
      </div>
      <label>ক্যাটাগরি</label>
      <select id="stockCat">
        <option value="vpn">WireGuard VPN Key</option>
        <option value="proxy">Residential Proxy</option>
      </select>
      <label>ডাটা লিস্ট (প্রতি লাইনে একটি)</label>
      <textarea id="stockData" rows="2" placeholder="sample-key-1&#10;sample-key-2"></textarea>
      <button class="btn-action" onclick="saveStock()"><i class="fa-solid fa-plus"></i> স্টকে সেভ করুন</button>
    </div>

    <!-- বট টোকেন কার্ড -->
    <div class="card">
      <div class="card-title">টেলিগ্রাম বট ম্যানেজার</div>
      <label>Bot Token</label>
      <input type="text" id="botToken" placeholder="BotFather থেকে পাওয়া টোকেন দিন">
      <button class="btn-action" style="background: var(--blue);" onclick="saveBotToken()"><i class="fa-solid fa-paper-plane"></i> টোকেন কানেক্ট করুন</button>
    </div>

    <!-- সাম্প্রতিক ডেলিভারি লিস্ট -->
    <div class="card">
      <div class="card-title">সাম্প্রতিক অর্ডার লগ</div>
      <div class="order-list" id="orderList">
        <div style="text-align:center; padding: 15px; color: var(--text-muted); font-size: 12px;">ডাটা লোড হচ্ছে...</div>
      </div>
    </div>

  </div>

  <!-- বটম মোবাইল ন্যাভিগেশন বার -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>হোম</span>
    </a>
    <a href="customers.html" class="nav-item">
      <i class="fa-solid fa-user-group"></i>
      <span>কাস্টমার</span>
    </a>
    <a href="bot-ui.html" class="nav-item">
      <i class="fa-solid fa-palette"></i>
      <span>বট UI</span>
    </a>
  </nav>

</body>
</html>
