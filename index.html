<!-- index.html-এর ভেতর এই কার্ডটি যোগ করুন -->
<div class="card" style="margin-top: 20px;">
  <div class="card-title">👥 সাম্প্রতিক কাস্টমার ও অর্ডার লিস্ট</div>
  <table style="width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px;">
    <thead>
      <tr style="border-bottom: 1px solid #334155; color: #9ca3af; text-align: left;">
        <th style="padding: 8px;">কাস্টমার</th>
        <th style="padding: 8px;">ইউজারনেম</th>
        <th style="padding: 8px;">প্রোডাক্ট</th>
        <th style="padding: 8px;">ডেলিভারি ডাটা</th>
      </tr>
    </thead>
    <tbody id="ordersTableBody">
      <!-- Firebase থেকে স্বয়ংক্রিয়ভাবে ডাটা লোড হবে -->
    </tbody>
  </table>
</div>

<script type="module">
  // কাস্টমার অর্ডার লাইভ শোনার ফাংশন
  import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const db = getFirestore();
  const q = query(collection(db, "orders"), orderBy("timestamp", "desc"), limit(10));

  onSnapshot(q, (snapshot) => {
    const tbody = document.getElementById("ordersTableBody");
    tbody.innerHTML = "";
    snapshot.forEach((doc) => {
      const order = doc.data();
      const tr = document.createElement("tr");
      tr.style.borderBottom = "1px solid #1f2937";
      tr.innerHTML = `
        <td style="padding: 8px;">${order.first_name || 'Anonymous'}</td>
        <td style="padding: 8px; color: #38bdf8;">@${order.username || 'N/A'}</td>
        <td style="padding: 8px;"><b>${order.product}</b></td>
        <td style="padding: 8px; font-family: monospace; color: #22c55e;">${order.delivered_credential}</td>
      `;
      tbody.appendChild(tr);
    });
  });
</script>
